name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # `brew test-bot --only-tap-syntax` hardcodes `brew audit --except=installed`
      # (see Homebrew/brew Library/Homebrew/test_bot/tap_syntax.rb) with no way to
      # add extra --except values. Our formulas are pushed here directly by
      # GoReleaser, whose Homebrew formula template always writes an explicit
      # `version "x.y.z"` line (no config knob to omit it: see
      # https://github.com/goreleaser/goreleaser/issues/1908). Since our download
      # URLs already embed the version, `brew audit` flags that line as redundant
      # and fails CI on every release. Run the same steps `--only-tap-syntax`
      # would run, with `version` added to the audit exceptions.
      - run: brew style ichizero/tap

      - run: brew readall --aliases --os=all --arch=all ichizero/tap

      - run: brew audit --except=installed,version --tap=ichizero/tap

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
