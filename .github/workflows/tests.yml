name: brew test-bot

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - Formula/**

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae --testing-formulae=ichizero/tap/protoc-gen-connect-ktor

      - name: Require bottle and metadata
        run: |
          shopt -s nullglob
          bottles=( *.bottle.*.tar.gz )
          metadata=( *.bottle.json )
          test "${#bottles[@]}" -gt 0
          test "${#metadata[@]}" -gt 0

      - name: Upload bottles as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: test-bot
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Set up git
        uses: Homebrew/actions/git-user-config@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Download bottles from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottles_*
          merge-multiple: true

      - name: Verify bottle artifacts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          metadata = sorted(Path('.').glob('*.bottle.json'))
          if len(metadata) != 3:
              raise SystemExit(f'Expected three bottle JSON files, found {len(metadata)}')

          tags = []
          for path in metadata:
              formulas = json.loads(path.read_text())
              if len(formulas) != 1:
                  raise SystemExit(f'Expected one formula in {path}')
              bottle = next(iter(formulas.values()))['bottle']
              if len(bottle['tags']) != 1:
                  raise SystemExit(f'Expected one platform in {path}')
              for tag, details in bottle['tags'].items():
                  archive = Path(details['local_filename'])
                  if not archive.is_file():
                      raise SystemExit(f'Missing bottle {archive}')
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  if digest != details['sha256']:
                      raise SystemExit(f'Checksum mismatch for {archive}')
                  tags.append(tag)

          expected_tags = {'x86_64_linux', 'arm64_tahoe', 'arm64_golden_gate'}
          if set(tags) != expected_tags:
              raise SystemExit(f'Expected {expected_tags}, found {tags}')
          PY

      - name: Publish bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew pr-upload --debug

      - name: Push bottle commit
        uses: Homebrew/actions/git-try-push@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ github.token }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: main
