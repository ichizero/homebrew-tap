name: Update Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: connect-ktor release tag
        required: true
        type: string
      sha:
        description: Commit pointed to by the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: formula-update-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag_ref="refs/tags/${RELEASE_TAG}"
          refs="$(git ls-remote https://github.com/ichizero/connect-ktor.git \
            "$tag_ref" "${tag_ref}^{}")"
          tag_commit="$(awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }' <<< "$refs")"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<< "$refs")"
          fi
          if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "Release tag ${RELEASE_TAG} does not point to ${RELEASE_SHA}" >&2
            exit 1
          fi

      - name: Calculate source archive checksum
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/connect-ktor-source.tar.gz" \
            "https://github.com/ichizero/connect-ktor/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/connect-ktor-source.tar.gz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare Formula update
        id: formula
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/update-homebrew-formula.py \
            Formula/protoc-gen-connect-ktor.rb "$RELEASE_TAG" "$SOURCE_SHA256"
          if git diff --quiet -- Formula/protoc-gen-connect-ktor.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --check
            git diff -- Formula/protoc-gen-connect-ktor.rb
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Formula update PR
        if: steps.formula.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_PR_TOKEN is required (Contents and Pull requests write on this tap)" >&2
            exit 1
          fi
          branch="automation/protoc-gen-connect-ktor-${RELEASE_TAG}"
          existing_pr="$(gh pr list --repo ichizero/homebrew-tap --state open \
            --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Formula update PR already exists: $existing_pr"
            exit 0
          fi

          closed_pr="$(gh pr list --repo ichizero/homebrew-tap --state closed \
            --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$closed_pr" ]]; then
            echo "Formula update PR was closed: $closed_pr; review it before retrying" >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null
          branch_status=$?
          set -e
          if [[ "$branch_status" -eq 0 ]]; then
            git fetch --no-tags origin "refs/heads/${branch}"
            branch_ref="$(git rev-parse FETCH_HEAD)"
            changed_paths="$(git diff --name-only "HEAD...${branch_ref}")"
            if [[ "$changed_paths" != 'Formula/protoc-gen-connect-ktor.rb' ]]; then
              echo "Existing update branch changes unexpected files: $branch" >&2
              exit 1
            fi
            if ! cmp -s Formula/protoc-gen-connect-ktor.rb \
              <(git show "${branch_ref}:Formula/protoc-gen-connect-ktor.rb"); then
              echo "Existing update branch differs from the generated Formula: $branch" >&2
              exit 1
            fi
          elif [[ "$branch_status" -eq 2 ]]; then
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Formula/protoc-gen-connect-ktor.rb
            git commit -m "chore(homebrew): update protoc-gen-connect-ktor to ${RELEASE_TAG}"
            gh auth setup-git --hostname github.com
            git push --set-upstream origin "$branch"
          else
            echo "Could not check for existing update branch: $branch" >&2
            exit "$branch_status"
          fi

          cat > "$RUNNER_TEMP/tap-pr.md" <<EOF
          Update the source Formula to [connect-ktor ${RELEASE_TAG}](https://github.com/ichizero/connect-ktor/releases/tag/${RELEASE_TAG}).

          The pull request CI builds and audits the Formula and checks that bottles can be built on macOS 26, macOS 27, and Linux. After merge, this tap publishes bottles built on main.
          EOF
          gh pr create --repo ichizero/homebrew-tap --base main --head "$branch" \
            --title "chore(homebrew): update protoc-gen-connect-ktor to ${RELEASE_TAG}" \
            --body-file "$RUNNER_TEMP/tap-pr.md"
